[project]
name = "cd2s"
version = "0.1.0"
description = "Question-first guide to NCI-supported cancer research outputs: ingestion, linkage, reuse tracing, and export."
# 3.12 is the floor because that is what the pipeline is developed and run against, and
# what the workbook receipts record. Nothing in the source needs syntax newer than
# 3.11 today, so relaxing this is possible - but it would need the workbooks re-run
# and re-receipted on the older interpreter to stay honest.
requires-python = ">=3.12"
dependencies = [
  "httpx[http2]>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "tenacity>=8.2",
  "python-dateutil>=2.9",
  "orjson>=3.10",
  "rich>=13.7",
  "typer>=0.12",
  "lxml>=5.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]
notebooks = ["jupyter>=1.0", "nbclient>=0.10", "nbformat>=5.10", "pandas>=2.2",
             "numpy>=1.26", "matplotlib>=3.9", "lifelines>=0.28", "statsmodels>=0.14",
             "scipy>=1.13", "seaborn>=0.13", "pyarrow>=16.0"]

[project.scripts]
cds = "cds.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cds"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length is enforced by formatting, not by the linter.
# UP042: the enums deliberately mix in `str`. Switching to `enum.StrEnum` would change
#   `str(Member)` from the member repr to the bare value, which alters how existing
#   serialized records round-trip; not worth the churn for a style preference.
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Nothing in the suite touches the network. The adapters are exercised by running the
# real pipeline against its response cache; what is tested here is the logic that has
# actually produced a wrong number or a wrong claim on a page.
filterwarnings = ["error::UserWarning"]
