# Marker papers: which publication is each dataset's own.
#
# A marker paper describes the cohort and reports its data generation. It is not a paper
# that reused the data, and the difference decides three numbers on every dataset page:
# how often the dataset has been cited, which award paid to create it, and which later
# articles count as independent reuse.
#
# This file exists because the pipeline cannot infer it. `enrich._pick_primary` nominates
# the earliest heavily cited article that quotes the accession - but a marker paper
# published in 2011 does not quote a GDC project identifier introduced years later, so
# the true marker paper is never in the candidate pool and the heuristic can only ever
# pick a reuse paper. TCGA-OV was published as "cited 44 times" on the strength of a 2012
# reuse paper, while its actual marker paper has over six thousand citations.
#
# Every entry below was verified against Europe PMC by PMID, and the title, journal and
# year read back from the API rather than recalled. The disease in the title was checked
# against the project. Where no marker paper could be verified, the dataset is absent
# from this file rather than given a plausible one - `cds.reuse.markers` then withholds
# the citation count entirely, which is the honest rendering.
#
# Known absences, all confirmed rather than assumed:
#   gdc-tcga-dlbc      TCGA published no Network marker paper for DLBC.
#   gdc-target-rt      No TARGET rhabdoid cohort paper; only reanalyses.
#   gdc-target-all-p1/p2/p3  No phase-specific cohort paper.
#   gdc-mmrf-commpass  CoMMpass has no single cohort-descriptor publication.
#
# See cds/reuse/markers.py for how this is applied and what it licenses.

reviewer: CD2S project curation
reviewed_at: 2026-09-20
source: Europe PMC REST API (title, journal and year verified per PMID)

