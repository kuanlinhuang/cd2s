id: gdc-tcga-brca
is_showcase: true
reviewer: Cancer Data Showcase project curation
reviewed_at: 2026-09-18
review:
  status: project_curated
  sections_reviewed: [useful_for, limitations, inappropriate_uses, access_steps, primary_publications]
one_liner: >-
  1,098 breast tumors measured twelve ways across GDC and IDC, with treatment outcome on
  64% of cases - the most reused dataset in this corpus and still the reference cohort for
  method development.
summary: >-
  TCGA breast is the most heavily analyzed dataset indexed here: 2,463 articles reference it
  in their methods or results. Its continuing value is less about novelty than about being
  the common denominator - a cohort so widely used that a new method which cannot reproduce
  known findings on it is not yet credible.

  Two things about it are less widely appreciated. First, its radiology and pathology
  imaging lives in the Imaging Data Commons rather than the GDC, so the same 1,098 patients
  carry twelve measurement types once the repositories are joined, and most analyses use
  only the genomic subset. Second, its treatment annotation is better than its reputation:
  therapeutic agents are recorded for 71% of cases and a treatment outcome for 64%, which
  supports response questions people generally assume require a trial cohort.
primary_publications:
  - pmid: "23000897"
    title: Comprehensive molecular portraits of human breast tumors
    journal: Nature
    year: 2012
    url: https://pubmed.ncbi.nlm.nih.gov/23000897/
useful_for:
  - question: Does a new computational method reproduce established breast cancer molecular subtypes?
    rationale: >-
      Expression, methylation, copy number, microRNA and protein array data on largely the
      same 1,098 tumors, with subtype assignments established across hundreds of prior
      papers. This is the standard benchmark, and the density of prior work is the point.
    required_modalities: [rna_seq, methylation, copy_number, protein_array]
    feasibility: direct
    approx_n: 1080
    statistical_note: >-
      Because so many methods have been tuned on this cohort, strong performance here is
      weak evidence of generalization. Pair it with an external cohort.
    topics: [methods-benchmarking, molecular-subtypes]
    exemplar_pmid: "23000897"
  - question: Which molecular features are associated with response to specific systemic therapies?
    rationale: >-
      Therapeutic agents are recorded for 71% of cases - cyclophosphamide, tamoxifen,
      anastrozole, paclitaxel and doxorubicin are the commonest - and a treatment outcome
      field is populated for 64%. Combined with expression on 1,095 cases this supports
      agent-stratified response analysis.
    required_modalities: [rna_seq, treatment]
    required_fields:
      - diagnoses.treatments.therapeutic_agents
      - diagnoses.treatments.treatment_outcome
    feasibility: direct
    approx_n: 700
    statistical_note: >-
      Treatment was not randomized and is confounded with stage, subtype and era of care.
      Any agent comparison needs explicit confounding control and should be framed as
      associative.
    topics: [treatment-response, breast]
  - question: Do radiology or pathology image features add prognostic information beyond molecular data?
    rationale: >-
      Imaging for these same patients is held in the Imaging Data Commons and is openly
      downloadable, while the molecular data sit in the GDC. Joining them gives a
      multimodal cohort most users never realise is available.
    required_modalities: [radiology, histopathology, rna_seq]
    feasibility: needs_linkage
    approx_n: 1098
    statistical_note: >-
      Imaging coverage is not complete across the cohort; build the intersection first and
      check it is not biased by site or era.
    topics: [multimodal, imaging, prognosis]
  - question: What distinguishes long-term survivors, given a median follow-up of 27.1 months?
    rationale: >-
      Vital status is informative for 99.9% of cases and follow-up time is computable,
      giving a clean overall survival endpoint on a large cohort.
    required_modalities: [clinical, outcome, rna_seq]
    feasibility: direct
    approx_n: 1097
    statistical_note: >-
      Breast cancer events accrue over a decade or more, and the median patient here is
      followed under three years, although a minority reach twenty years. Late-recurrence
      questions are underpowered.
    topics: [survival, breast]
limitations:
  - kind: statistical_power
    statement: >-
      Median follow-up is 27.1 months across 1,096 of 1,098 cases, though the maximum
      reaches 282 months. Breast cancer, particularly hormone receptor positive disease,
      recurs over ten to twenty years, so the median patient is observed through only the
      early part of the natural history.
    severity: major
    affected_analyses: [Late recurrence, Ten-year survival, Endocrine resistance over time]
    mitigation: Use restricted mean survival time; do not extrapolate beyond observed follow-up.
  - kind: treatment_context
    statement: >-
      Treatment is observational and unrandomised, recorded retrospectively, and reflects
      standards of care from the late 2000s. Modern regimens including CDK4/6 inhibitors,
      antibody-drug conjugates and immunotherapy are absent.
    severity: major
    affected_analyses: [Predictive biomarker claims, Contemporary treatment relevance]
    mitigation: Frame findings as historical-cohort associations rather than predictive claims.
  - kind: population_coverage
    statement: >-
      757 of 1,098 patients are recorded as white and 183 as Black or African American, with
      95 not reported. Male breast cancer is present only in very small numbers.
    severity: major
    affected_analyses: [Disparities research beyond the two largest groups, Male breast cancer]
    mitigation: >-
      The 183 Black patients support some disparities work but with limited power for
      subtype-stratified analysis.
  - kind: platform_obsolescence
    statement: >-
      Methylation uses HM450 and HM27 arrays and copy number uses Affymetrix SNP 6.0 -
      platforms no longer in routine use, which complicates integration with contemporary data.
    severity: minor
    affected_analyses: [Cross-cohort integration with modern platforms]
    mitigation: Use probe-level harmonization and restrict to shared features.
  - kind: access_constraint
    statement: 43,492 of 71,423 files are controlled; derived matrices are open.
    severity: minor
    affected_analyses: [Raw sequence analysis]
    mitigation: Most secondary analyses run entirely on the open derived files.
inappropriate_uses:
  - statement: Evaluating modern therapies such as CDK4/6 inhibitors or immunotherapy.
    reason: Treatment predates these agents; they do not appear in the cohort.
  - statement: Estimating breast cancer incidence or population survival.
    reason: A convenience sample from participating centres, with no denominator.
  - statement: Claiming a novel method generalizes on the basis of TCGA-BRCA performance alone.
    reason: >-
      The cohort has been used so extensively for method development that performance on it
      is partly a measure of collective overfitting.
access_steps:
  - order: 1
    action: Download open derived matrices from the GDC
    detail: Expression, copy number, methylation and clinical files need no account.
    url: https://portal.gdc.cancer.gov/projects/TCGA-BRCA
    est_time: 1 hour
    cli_snippet: |
      curl -s 'https://api.gdc.cancer.gov/files' --get \
        --data-urlencode 'filters={"op":"and","content":[
          {"op":"in","content":{"field":"cases.project.project_id","value":["TCGA-BRCA"]}},
          {"op":"in","content":{"field":"access","value":["open"]}},
          {"op":"in","content":{"field":"data_type","value":["Gene Expression Quantification"]}}]}' \
        --data-urlencode 'fields=file_id,file_name,cases.submitter_id' \
        --data-urlencode 'size=2000&format=TSV' > brca_expression_files.tsv
  - order: 2
    action: Add the imaging from the Imaging Data Commons if you need it
    detail: Same patients, different repository, also open. Most users never make this join.
    url: https://portal.imaging.datacommons.cancer.gov/explore/?collection_id=tcga_brca
    est_time: 1-2 hours
  - order: 3
    action: Request controlled access only if you need sequence-level data
    url: https://gdc.cancer.gov/access-data/obtaining-access-controlled-data
    requires: [eRA Commons account, institutional signing official approval]
    est_time: days to a few weeks
tags: [reference-cohort, multimodal, treatment-response, breast]
