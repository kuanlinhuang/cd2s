id: pdc-cptac-aml-study
is_showcase: true
reviewer: Cancer Data Showcase project curation
reviewed_at: 2026-09-18
review:
  status: project_curated
  sections_reviewed: [useful_for, limitations, inappropriate_uses, access_steps]
one_liner: >-
  164 acute myeloid leukaemias with proteome, phosphoproteome, acetylome and glycoproteome,
  plus lipidomics and metabolomics on 98 - one of only three NCI cohorts carrying lipidomic
  data, openly downloadable.
summary: >-
  Lipidomics is the scarcest measurement type in the entire corpus indexed here: three
  studies carry it, all within CPTAC, and this is the largest. Combined with metabolomics on
  the same 98 patients and four proteomic layers on all 164, it supports metabolic questions
  in leukaemia that cannot be posed anywhere else with measured rather than inferred data.

  AML is a disease where metabolic state has clear therapeutic relevance, and where measured
  lipid and metabolite data on primary patient samples are close to unobtainable. The
  barrier to reuse here is discoverability rather than access: everything is open, and
  nothing about the PDC catalog entry tells a metabolism researcher that this cohort
  exists.
useful_for:
  - question: >-
      How does lipid composition differ across AML subtypes, and does it relate to
      differentiation state?
    rationale: >-
      Lipidomic profiles on 98 primary AML samples, alongside proteome on all 164, allow
      lipid class abundance to be related to protein markers of myeloid differentiation on
      the same patients. Measured lipidomics on primary AML at this scale is essentially
      unavailable elsewhere.
    required_modalities: [lipidome, proteome]
    feasibility: direct
    approx_n: 98
    statistical_note: >-
      98 samples supports class-level comparison and well-powered subgroup contrasts only
      for common subtypes; rare fusion subgroups will have single-digit counts.
    topics: [metabolism, leukaemia, scarce-measurement]
  - question: >-
      Do measured metabolite levels agree with metabolic state inferred from transcript or
      protein abundance?
    rationale: >-
      Metabolomics and proteomics on the same 98 patients allow a direct test of an
      assumption that a large body of computational metabolic modeling depends on and
      rarely gets to check.
    required_modalities: [metabolome, proteome]
    feasibility: direct
    approx_n: 98
    statistical_note: >-
      This is a methods-validation design; effect sizes are the quantity of interest, not
      significance.
    topics: [metabolism, methods-benchmarking]
  - question: >-
      Does protein acetylation, a modification tightly coupled to metabolic cofactor
      availability, track measured metabolite levels?
    rationale: >-
      Acetylome on 164 cases and metabolome on 98 overlap substantially. Acetylation depends
      on acetyl-CoA availability, so this cohort can test a mechanistic link that is usually
      assumed rather than measured.
    required_modalities: [acetylproteome, metabolome]
    feasibility: direct
    approx_n: 98
    topics: [post-translational-modification, metabolism]
  - question: >-
      Can glycoproteomic features stratify AML in ways expression cannot?
    rationale: >-
      Glycoproteome on all 164 cases; cell-surface glycosylation is directly relevant to
      immunotherapy target selection in myeloid disease.
    required_modalities: [glycoproteome, proteome]
    feasibility: direct
    approx_n: 164
    topics: [immunotherapy-targets, subtype-discovery]
limitations:
  - kind: missing_data
    statement: >-
      Cytogenetic risk group - the primary stratifier in AML - is not in the PDC clinical
      records, and neither is any therapeutic agent. A treatment record of any kind exists
      for 2% of the 164 cases. What the API does serve is vital status and follow-up time
      for 99% of cases, which is enough for overall survival but not for anything
      risk-stratified.
    severity: blocking
    affected_analyses: [Risk-stratified comparison, Treatment-response analysis]
    mitigation: >-
      Obtain cytogenetics and treatment from the GDC CPTAC records or the CPTAC data portal
      and join on case identifier before drawing any risk-stratified conclusion.
  - kind: harmonization
    statement: >-
      Lipidome and metabolome cover 98 cases while the proteomic layers cover 164, so the
      metabolic analyses run on 60% of the cohort.
    severity: major
    affected_analyses: [Complete-case multi-omic integration]
    mitigation: Report the overlap explicitly and check whether the 98 differ systematically from the rest.
  - kind: batch_technical
    statement: >-
      Lipidomic and metabolomic measurements are especially sensitive to sample handling and
      storage, and batch information is not exposed in the study metadata.
    severity: major
    affected_analyses: [Quantitative cross-sample comparison]
    mitigation: Inspect for batch structure before interpreting; treat absolute levels with caution.
  - kind: statistical_power
    statement: 98 samples limits subgroup analysis in a disease with many molecularly defined subtypes.
    severity: major
    affected_analyses: [Subtype-specific metabolic profiling]
    mitigation: Pre-specify a small number of subtype contrasts.
inappropriate_uses:
  - statement: Prognostic claims that do not adjust for cytogenetic risk.
    reason: >-
      Vital status and follow-up are present for 99% of cases, so a survival model will
      fit - but risk group is absent, and in AML it dominates prognosis.
  - statement: Treatment-response or resistance analysis from these data.
    reason: A treatment record of any kind exists for 2% of the cohort and no agent is named.
  - statement: Risk-group comparisons without obtaining cytogenetics separately.
    reason: Cytogenetic risk is the primary stratifier in AML and is not present here.
access_steps:
  - order: 1
    action: Download the lipidomic and metabolomic studies from PDC
    detail: Open access, no account required.
    url: https://pdc.cancer.gov/pdc/browse
    est_time: 1 hour
  - order: 2
    action: Retrieve matching clinical and cytogenetic data from the GDC CPTAC records
    url: https://portal.gdc.cancer.gov/projects/CPTAC-3
    est_time: 2-3 hours
tags: [scarce-modality, lipidomics, metabolomics, leukaemia, open-access, underexplored-candidate]
