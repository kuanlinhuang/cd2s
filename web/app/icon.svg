<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cancer Data Showcase">
  <title>Cancer Data Showcase</title>
  <defs>
    <linearGradient id="cds-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="cds-glow" x="-30%" y="-30%" width="160%" height="160%">
